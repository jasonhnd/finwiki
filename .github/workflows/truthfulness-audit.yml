name: Truthfulness Audit

on:
  schedule:
    # Weekly maintenance sweep: Monday 03:20 JST.
    - cron: "20 18 * * 0"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional freshness date in YYYY-MM-DD. Defaults to the JST run date."
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Resolve audit date
        id: resolve_date
        shell: bash
        env:
          REQUESTED_AS_OF: ${{ github.event.inputs.as_of || '' }}
        run: |
          as_of="$REQUESTED_AS_OF"
          if [[ -z "$as_of" ]]; then
            as_of="$(TZ=Asia/Tokyo date +'%Y-%m-%d')"
          fi

          if [[ ! "$as_of" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::as_of must be YYYY-MM-DD, got '$as_of'"
            exit 1
          fi

          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"

      - name: Download two prior scheduled audit artifacts
        shell: bash
        env:
          AUDIT_HISTORY_DIR: ${{ runner.temp }}/finwiki-truthfulness-history
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_HISTORY_DIR"

          run_ids="$(gh run list \
            --workflow truthfulness-audit.yml \
            --event schedule \
            --status success \
            --limit 2 \
            --json databaseId \
            --jq '.[].databaseId')"

          downloaded=0
          for run_id in $run_ids; do
            gh run download "$run_id" \
              --pattern 'truthfulness-audit-*' \
              --dir "$AUDIT_HISTORY_DIR/run-$run_id"
            downloaded=$((downloaded + 1))
          done

          echo "Downloaded $downloaded prior scheduled audit artifact(s)."

      - name: Run truthfulness audits
        env:
          AUDIT_HISTORY_DIR: ${{ runner.temp }}/finwiki-truthfulness-history
          AUDIT_OUTPUT_DIR: ${{ runner.temp }}/finwiki-truthfulness-audit
        run: bun run audit:all --out "$AUDIT_OUTPUT_DIR" --history-dir "$AUDIT_HISTORY_DIR" --as-of "${{ steps.resolve_date.outputs.as_of }}"

      - name: Publish threshold summary
        if: always()
        shell: bash
        env:
          AUDIT_OUTPUT_DIR: ${{ runner.temp }}/finwiki-truthfulness-audit
        run: |
          if [[ -f "$AUDIT_OUTPUT_DIR/summary.md" ]]; then
            cat "$AUDIT_OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No audit summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truthfulness-audit-${{ steps.resolve_date.outputs.as_of }}
          path: ${{ runner.temp }}/finwiki-truthfulness-audit/
          if-no-files-found: error
