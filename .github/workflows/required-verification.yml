name: Required Verification

on:
  pull_request:
    branches: [pre, main]
  push:
    branches: [pre, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Required verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Run the canonical release pipeline
        run: bun run verify
